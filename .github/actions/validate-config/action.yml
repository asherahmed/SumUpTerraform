name: Validate team declarations
description: Check ownership boundaries and filename identity before running Terraform.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install configuration parsers
      shell: bash
      run: python -m pip install -r .github/requirements.txt
    - name: Validate configuration contract
      id: contract
      shell: python
      run: |
        from pathlib import Path
        import re
        import hcl2

        def validate_repository(root):
            # Parse HCL, rather than matching assignments with regex: comments and
            # multiline strings must not hide forbidden platform overrides.
            platform_path = root / "platform/dev.tfvars"
            with platform_path.open() as stream:
                platform = hcl2.load(stream)
            if set(platform) != {"namespace", "account_id", "aws_region"}:
                raise ValueError("platform/dev.tfvars must declare namespace, account_id and aws_region only")

            files = sorted((root / "teams").rglob("*.tfvars"))
            if not files:
                raise ValueError("At least one team declaration is required")
            for path in files:
                if path.parent != root / "teams" or not re.fullmatch(r"[a-z][a-z0-9-]{0,14}[a-z0-9]", path.stem):
                    raise ValueError(f"{path}: invalid team filename")
                if path.is_symlink():
                    raise ValueError(f"{path}: team declarations must be regular files")
                with path.open() as stream:
                    team = hcl2.load(stream)
                allowed = {"team_name", "trusted_role_arn", "buckets"}
                if set(team) != allowed:
                    raise ValueError(f"{path}: declare only {sorted(allowed)}; platform overrides are forbidden")
                if team["team_name"] != path.stem:
                    raise ValueError(f"{path}: team_name must equal filename stem {path.stem!r}")
                role = team["trusted_role_arn"]
                if not isinstance(role, str) or not re.fullmatch(r"arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@/-]+", role):
                    raise ValueError(f"{path}: trusted_role_arn must be a literal, explicit IAM role ARN")
                buckets = team["buckets"]
                if not isinstance(buckets, dict) or not buckets:
                    raise ValueError(f"{path}: buckets must be a nonempty map")
                for key, bucket in buckets.items():
                    if not re.fullmatch(r"[a-z][a-z0-9-]{0,14}[a-z0-9]", key):
                        raise ValueError(f"{path}: invalid bucket key {key!r}")
                    if not isinstance(bucket, dict) or set(bucket) != {"visibility"}:
                        raise ValueError(f"{path}: bucket {key!r} must declare visibility only")
                    if bucket["visibility"] not in ("public", "private"):
                        raise ValueError(f"{path}: bucket {key!r} must declare public or private visibility")
            return [path.stem for path in files]

        if __name__ == "__main__":
            teams = validate_repository(Path.cwd())
            print(f"Validated {len(teams)} team declarations")
