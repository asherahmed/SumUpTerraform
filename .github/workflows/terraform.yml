name: Terraform team platform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  PLATFORM_CONFIG: ../platform/dev.tfvars

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform fmt -check -recursive

      - run: terraform -chdir=modules/team-resources init -backend=false -lockfile=readonly
      - run: terraform -chdir=modules/team-resources validate
      - run: terraform -chdir=modules/team-resources test

      - run: terraform -chdir=live init -backend=false -lockfile=readonly
      - run: terraform -chdir=live validate

  detect:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.teams.outputs.matrix }}
      has_changes: ${{ steps.teams.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/github-script@v7
        id: teams
        with:
          script: |
            const { execFileSync } = require('node:child_process');

            const git = (...args) =>
              execFileSync('git', args, { encoding: 'utf8' });

            // NUL delimiters keep filenames intact; preflight rejects invalid IDs.
            const all = git('ls-files', '-z', 'teams/*.tfvars')
              .split('\0')
              .filter(Boolean);

            for (const file of all) {
              if (!/^teams\/[a-z][a-z0-9-]{0,14}[a-z0-9]\.tfvars$/.test(file)) {
                throw new Error(`Invalid team filename: ${file}`);
              }
            }

            // Dispatch and a first push reconcile every declaration.
            let selected = all;

            if (context.eventName !== 'workflow_dispatch') {
              const base = context.eventName === 'pull_request'
                ? context.payload.pull_request.base.sha
                : context.payload.before;

              if (base && !/^0+$/.test(base)) {
                const deleted = git(
                  'diff',
                  '--no-renames',
                  '--diff-filter=D',
                  '--name-only',
                  '-z',
                  base,
                  'HEAD',
                  '--',
                  'teams/'
                ).split('\0').filter(Boolean);

                if (deleted.some(file => file.endsWith('.tfvars'))) {
                  throw new Error(
                    'Team deletion or rename requires the documented offboarding procedure.'
                  );
                }

                const changed = git(
                  'diff',
                  '--no-renames',
                  '--name-only',
                  '-z',
                  base,
                  'HEAD'
                ).split('\0').filter(Boolean);

                const shared = changed.some(
                  file =>
                    /^(modules\/|live\/|platform\/|\.github\/)/.test(file) ||
                    file === '.terraform-version'
                );

                selected = shared
                  ? all
                  : all.filter(file => changed.includes(file));
              }
            }

            const teams = selected.map(file => file.slice(6, -7));

            // At most 20 GitHub matrix jobs; each job processes its own batch.
            const count = Math.min(20, teams.length);
            const batches = Array.from({ length: count }, () => []);

            teams.forEach((team, index) => {
              batches[index % count].push(team);
            });

            core.setOutput(
              'has_changes',
              teams.length > 0 ? 'true' : 'false'
            );

            core.setOutput(
              'matrix',
              JSON.stringify({
                include: batches.map((teams, batch) => ({ batch, teams }))
              })
            );

  mock_team_tests:
    needs: [test, detect]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform -chdir=live init -backend=false -lockfile=readonly

      - name: Mock-test each changed team
        env:
          TEAM_BATCH: ${{ toJSON(matrix.teams) }}

        shell: bash

        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mock-plans"
          failed=0

          while IFS= read -r team; do
            echo "Mock-testing team: $team"

            if terraform -chdir=live test -no-color -verbose \
              -var-file="../teams/$team.tfvars" \
              -var-file="$PLATFORM_CONFIG" \
              -var="expected_team_name=$team" > "$RUNNER_TEMP/mock-plans/$team.txt" 2>&1; then
              echo "PASS: $team"
            else
              failed=1
              echo "FAIL: $team"
            fi
            cat "$RUNNER_TEMP/mock-plans/$team.txt"
          done < <(jq -r '.[]' <<< "$TEAM_BATCH")
          exit "$failed"

      - name: Upload mock plan previews (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-plans-${{ matrix.batch }}
          path: ${{ runner.temp }}/mock-plans/*.txt
          if-no-files-found: ignore
          retention-days: 3

  comment_plan:
    needs: [test, detect, mock_team_tests]
    # Never use pull_request_target to run a contributor's Terraform with write access.
    # Fork PR tokens cannot write comments; their previews remain in run artifacts.
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.detect.outputs.has_changes == 'true'
        continue-on-error: true
        with:
          pattern: mock-plans-*
          merge-multiple: true
          path: mock-plans

      - name: Create or update the mock plan comment
        uses: actions/github-script@v7
        env:
          DETECTION_RESULT: ${{ needs.detect.result }}
          HAS_CHANGES: ${{ needs.detect.outputs.has_changes }}
          TEST_RESULT: ${{ needs.test.result }}
          MOCK_RESULT: ${{ needs.mock_team_tests.result }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- terraform-team-platform-mock-plan -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha;
            // A slow older run must not overwrite a newer commit's preview.
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            if (pr.head.sha !== sha) {
              core.info('Skipping superseded commit.');
              return;
            }
            let body = `${marker}\n### Terraform mock plan preview\nCommit: \`${sha}\`\n\n`;
            body += '**Mock AWS only: not a live, state-aware AWS plan. Nothing is deployed.**\n\n';
            body += `Checks: ${process.env.TEST_RESULT}; mock plans: ${process.env.MOCK_RESULT}.\n\n`;
            body += `[Full output and downloadable artifacts (3-day retention)](${runUrl})\n\n`;
            const files = fs.existsSync('mock-plans')
              ? fs.readdirSync('mock-plans').filter(f => /^[a-z][a-z0-9-]*\.txt$/.test(f)).sort()
              : [];
            if (process.env.DETECTION_RESULT !== 'success') {
              body += 'Team detection failed; no complete preview is available. See the run logs.\n';
            } else if (process.env.HAS_CHANGES !== 'true') {
              body += 'No team or shared infrastructure changes detected.\n';
            } else if (!files.length) {
              body += 'No preview artifacts were produced. Check initialization and test failures in the run logs.\n';
            }
            // Bound the comment well below GitHub's limit even for 300+ teams.
            // Treat Terraform output as plain text, never executable code or HTML.
            const escape = text => text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            let shown = 0;
            for (const file of files) {
              const output = escape(fs.readFileSync(`mock-plans/${file}`, 'utf8'));
              const preview = output.slice(0, 6000);
              const section = `<details><summary>${file.slice(0, -4)}</summary>\n\n<pre>${preview}</pre>\n${output.length > preview.length ? '\nTruncated; see full artifact.\n' : ''}</details>\n\n`;
              if (body.length + section.length > 55000) break;
              body += section;
              shown++;
            }
            if (shown < files.length) body += `${files.length - shown} additional team previews are available in the run artifacts.\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
